<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古江 町内会チラシ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<style>
  :root{--moss:#2E5144;--moss-d:#1F3A30;--paper:#F7F5F0;--ink:#25241F;--gold:#E4B363;--sky:#7BA7B4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#dcd8cf;font-family:"Noto Sans JP",system-ui,sans-serif;display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  .page{
    container-type:inline-size;
    width:min(94vw,680px);aspect-ratio:210/297;background:var(--paper);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
    border-radius:10px;box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
  /* ---- TOP (photo) ---- */
  .top{flex:0 0 45%;position:relative;overflow:hidden}
  .top .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .top .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(31,58,48,.30) 0%,rgba(31,58,48,.05) 40%,rgba(31,58,48,.78) 100%)}
  .kicker{position:absolute;top:5cqw;left:6cqw;color:#fff;font-family:"Zen Kaku Gothic New";font-weight:700;
    font-size:2.9cqw;letter-spacing:.22em;display:flex;align-items:center;gap:2cqw}
  .kicker::before{content:"";width:7cqw;height:2px;background:var(--gold);display:inline-block}
  .top-txt{position:absolute;left:6cqw;right:6cqw;bottom:5cqw;color:#fff}
  .top-txt h1{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:9.2cqw;line-height:1.18;
    letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.35);word-break:keep-all}
  .top-txt h1 em{font-style:normal;color:var(--gold)}
  /* ---- MID ---- */
  .mid{flex:1 1 auto;background:var(--paper);padding:5.5cqw 6cqw;display:flex;flex-direction:column;
    justify-content:center;gap:3cqw;text-align:center}
  .mid .line{font-family:"Zen Kaku Gothic New";font-weight:700;color:var(--moss);font-size:3.7cqw;line-height:1.65;word-break:keep-all}
  .price{display:flex;align-items:baseline;justify-content:center;gap:1.2cqw;font-family:"Outfit",sans-serif;color:var(--ink)}
  .price .lab{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:4.4cqw;color:var(--moss);align-self:center;margin-right:1cqw}
  .p-num{font-size:20cqw;font-weight:800;line-height:.9;color:var(--moss);letter-spacing:-.02em}
  .p-yen{font-size:7cqw;font-weight:800;color:var(--moss)}
  .p-per{font-size:4.6cqw;font-weight:700;color:var(--ink);opacity:.7}
  .yearnote{font-family:"Zen Kaku Gothic New";font-weight:500;font-size:2.7cqw;color:#7a756a}
  .ask{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:6.6cqw;color:var(--ink);line-height:1.25;
    letter-spacing:.01em;word-break:keep-all;margin-top:1cqw}
  .ask u{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:.9cqw;text-underline-offset:1.2cqw}
  /* ---- BOTTOM (moss + QR) ---- */
  .bottom{flex:0 0 26%;background:var(--moss-d);color:#fff;display:flex;align-items:center;gap:5cqw;
    padding:5cqw 6cqw;position:relative}
  .qr{background:#fff;padding:2.4cqw;border-radius:3cqw;flex:0 0 auto;line-height:0}
  .qr img{width:30cqw;height:30cqw;display:block}
  .cta{flex:1 1 auto}
  .cta .c1{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:6.4cqw;line-height:1.15}
  .cta .c1 span{color:var(--gold)}
  .cta .c2{font-family:"Zen Kaku Gothic New";font-weight:700;font-size:3.4cqw;margin-top:1.5cqw;color:#d6e3dd}
  .cta .url{font-family:"Outfit",sans-serif;font-weight:700;font-size:3cqw;margin-top:2cqw;color:#fff;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:2cqw;
    padding:1.4cqw 2.4cqw;display:inline-block;letter-spacing:.01em;word-break:break-all}
  .org{position:absolute;left:6cqw;right:6cqw;bottom:2cqw;text-align:center;
    font-family:"Zen Kaku Gothic New";font-weight:500;font-size:2.5cqw;color:rgba(255,255,255,.7)}
  /* print */
  @media print{
    body{background:#fff;padding:0}
    @page{size:A4;margin:0}
    .page{width:210mm;height:297mm;border-radius:0;box-shadow:none}
  }
</style>
